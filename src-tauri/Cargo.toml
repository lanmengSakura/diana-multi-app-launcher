[package]
name = "diana-codex-launcher"
version = "0.1.0-beta.4-rc.2"
description = "A foreground multi-app launcher for the Diana visual theme collection."
authors = ["lanmengSakura"]
edition = "2021"
license = "MIT"

[lib]
name = "diana_codex_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.11.2", features = [] }
toml_edit = "0.25.13"
